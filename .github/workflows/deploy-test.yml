name: Deploy frontend to test

on:
  push:
    branches: [ main ]          # change to your branch if it's not "main"
  workflow_dispatch:            # lets you run it manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://apitest.developzone.online/api

      - name: Deploy dist to Hostinger
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT }}
          SOURCE: "dist/"
          TARGET: "/home/u945507590/domains/developzone.online/public_html/front-courses/"
          ARGS: "-rltgoDzvO --delete"
